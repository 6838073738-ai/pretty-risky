<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pretty risky?</title>
<script>
/* Pretty risky? (JIPP Presentation 2): single file, offline. Click, then press the right arrow. Engine: notes/ENGINE.md */
/* ---- engine/core.js ---- */
/* Pretty risky? — engine core (adapted from ALL IN): namespace, stage scaling, scene registry, beat state machine,
   scene changes (handed to neural.js: hop / journey / opening / fade / hard), keyboard, debug hooks.
   Contract: notes/ENGINE.md. Plain script (no modules); runs from file://. */
(function () {
  'use strict';

  var A = window.ALLIN = window.ALLIN || {};
  var W = 1920, H = 1080;
  var EASE = 'cubic-bezier(.2,.8,.2,1)';
  var RV_SEL = '[data-in],[data-out],[data-only],[data-branch]';
  var CUTS = { hop: 1, journey: 1, opening: 1, fade: 1, hard: 1 };
  var MOODS = { void: 1, tissue: 1, room: 1, credits: 1 };
  var ACCENTS = { signal: 1, gas: 1, show: 1, brake: 1 };

  var defs = [];
  var st = A.state = {
    sceneIndex: 0,
    beat: 0,
    choices: {},
    polls: {},
    timer: { running: false, startedAt: 0, elapsedMs: 0, visible: false }
  };
  var dom = {};
  var gen = 0;                       // bumps on every scene mount; stale async work checks it
  var live = { el: null, def: null, timers: [], ambient: [], loops: [], mountedAt: 0, snapshot: false, landed: false };
  var listeners = {};

  A.W = W; A.H = H; A.EASE = EASE;
  A.ready = false;
  A.version = '2.0.0';
  /* Build target. `node build.js --artifact` injects `var ALLIN_MODE = 'artifact';` at the top of the script for the
     claude.ai Artifact copy (a page fragment the publisher wraps in its own skeleton). The USB build never defines it. */
  A.mode = (typeof ALLIN_MODE === 'string' && ALLIN_MODE === 'artifact') ? 'artifact' : 'usb';
  var GUTTER = A.mode === 'artifact' ? 16 : 0;     // artifact: black side gutter (px) at every window width
  A.timerMarks = [12 * 60 + 30, 14 * 60];        // presenter timer: amber at 12:30, red at 14:00 (15-minute talk)

  /* ---------------- tiny event bus ---------------- */
  A.on = function (evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); };
  A.emit = function (evt, data) {
    var l = listeners[evt] || [];
    for (var i = 0; i < l.length; i++) {
      try { l[i](data); } catch (e) { console.error('[ALLIN] ' + evt + ' handler failed', e); }
    }
  };

  /* ---------------- registry ---------------- */
  function sceneNum(id) { var m = /^S(\d+)$/i.exec(String(id || '')); return m ? parseInt(m[1], 10) : NaN; }
  A.sceneNum = sceneNum;

  /* build.js wraps every numbered scene file in try/catch and sets A._loading to its file name while it runs: a file
     that throws at load is dropped whole (A._dropFile) and listed in A.loadFailed, so one broken scene costs that scene,
     not the show (round-1 T2). tools/smoke.mjs compares the registered scenes with A.build.sceneFiles. */
  A._loading = null;
  A.loadFailed = [];
  A._dropFile = function (file) {
    for (var i = defs.length - 1; i >= 0; i--) if (defs[i]._file === file) defs.splice(i, 1);
    if (A.loadFailed.indexOf(file) < 0) A.loadFailed.push(file);
  };
  A.scene = function (def) {
    if (!def || !def.id) { console.error('[ALLIN] ALLIN.scene() needs an id'); return; }
    if (A._loading) def._file = A._loading;
    def.beats = Math.max(1, (def.beats | 0) || 1);
    def.mood = def.mood || 'tissue';
    if (!MOODS[def.mood]) console.warn('[ALLIN] ' + def.id + ': unknown mood ' + def.mood);
    if (def.cut && !CUTS[def.cut]) { console.warn('[ALLIN] ' + def.id + ': unknown cut ' + def.cut + ' (using hop)'); def.cut = 'hop'; }
    if (def.accent && !ACCENTS[def.accent]) console.warn('[ALLIN] ' + def.id + ': unknown accent ' + def.accent);
    if (def.cut === 'journey') {
      def.journey = def.journey || {};
      if (!def.journey.duration) def.journey.duration = 4000;
      if (def.journey.node == null) def.journey.node = 0;
    }
    if (def.choice) {
      if (def.choice.at == null) def.choice.at = 1;
      if (def.choice.branchBeat == null) def.choice.branchBeat = def.choice.at + 1;
      if (!def.choice.options) def.choice.options = { A: 'A', B: 'B' };
    }
    defs.push(def);
  };
  A.defs = function () { return defs; };
  A.cur = function () { return defs[st.sceneIndex]; };
  A.indexOf = function (id) {
    var n = typeof id === 'number' ? id : sceneNum(id);
    for (var i = 0; i < defs.length; i++) if (sceneNum(defs[i].id) === n) return i;
    return -1;
  };
  A.isRM = function () { return document.documentElement.classList.contains('rm'); };
  A.motion = function () { return A.isRM() ? 0.3 : 1; };
  A.gen = function () { return gen; };
  A.alive = function (g) { return g === gen; };
  A.liveEl = function () { return live.el; };
  A.landed = function () { return live.landed; };
  /* async helpers register here so a scene change cleans them up */
  A._timer = function (id) { live.timers.push(id); return id; };
  A._ambient = function (anim) { if (anim) live.ambient.push(anim); return anim; };
  /* infinite decorative loops (fx.anim iterations:Infinity): ambient + paused while reduced motion is on */
  A._loop = function (anim) {
    if (!anim) return anim;
    live.ambient.push(anim); live.loops.push(anim);
    if (A.isRM()) { try { anim.pause(); } catch (e) { /* ignore */ } }
    return anim;
  };
  /* ring start times kept across re-renders of the same scene (fx.ring opts.keep); reset whenever the scene changes */
  var ringMemo = {};
  A._ringStart = function (key, now) {
    if (!(key in ringMemo)) ringMemo[key] = now;
    return ringMemo[key];
  };
  /* effective choice (inherited A/B machinery; this show has no choice scenes, kept generic) */
  A.choiceOf = function (id) {
    if (st.choices[id]) return st.choices[id];
    var i = A.indexOf(id);
    if (i < 0 || i >= st.sceneIndex) return null;
    var d = defs[i];
    return d.choice ? defaultChoice(d) : null;
  };
  function firstOption(d) { return Object.keys(d.choice.options)[0] || 'A'; }
  function defaultChoice(d) { return d.choice['default'] || firstOption(d); }

  /* ---------------- reveals ---------------- */
  function intAttr(el, name) {
    var v = el.getAttribute(name);
    if (v === null || v === '') return null;
    var n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }
  function rvTarget(el, beat, choice) {
    var br = el.getAttribute('data-branch');
    if (br && br !== choice) return 'off';
    var only = intAttr(el, 'data-only'), inN = intAttr(el, 'data-in'), outN = intAttr(el, 'data-out');
    if (only !== null) { if (inN === null) inN = only; if (outN === null) outN = only + 1; }
    if (inN !== null && beat < inN) return 'pre';
    if (outN !== null && beat >= outN) return 'post';
    return 'on';
  }
  /* Reveals are applied with attribute writes only, never a layout read (repair round 2, BEAT: a read here restyled the
     whole scene inside the key press). Only an element coming back from display:none (data-rv="off": a choice branch)
     needs a styled start state for its transition: it is shown in its 'pre' state now and gets its target two frames
     later, if the beat is still the same. */
  function applyReveals(el, beat, choice, instant) {
    var list = el.querySelectorAll(RV_SEL), later = null, i;
    for (i = 0; i < list.length; i++) {
      var tg = rvTarget(list[i], beat, choice), now = list[i].getAttribute('data-rv');
      if (!instant && now === 'off' && tg !== 'off' && tg !== 'pre') {
        list[i].setAttribute('data-rv', 'pre');
        (later = later || []).push([list[i], tg]);
      } else if (now !== tg) list[i].setAttribute('data-rv', tg);
    }
    if (later) {
      var g = gen;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (g !== gen || st.beat !== beat) return;
          for (var k = 0; k < later.length; k++) if (later[k][0].getAttribute('data-rv') === 'pre') later[k][0].setAttribute('data-rv', later[k][1]);
        });
      });
    }
  }

  /* the cumulative beat classes b0..bN, data-beat and the choice classes on the scene root (public API). Only what
     changes is written: a beat adds one class and changes data-beat, nothing else */
  function setBeatClasses(el, def, beat, choice) {
    var top = Math.max(def.beats, beat + 1), cl = el.classList, n, bs = String(beat);
    for (n = 0; n < top; n++) { var want = beat >= n; if (cl.contains('b' + n) !== want) cl.toggle('b' + n, want); }
    if (el.getAttribute('data-beat') !== bs) el.setAttribute('data-beat', bs);
    if (cl.contains('choice-A') !== (choice === 'A')) cl.toggle('choice-A', choice === 'A');
    if (cl.contains('choice-B') !== (choice === 'B')) cl.toggle('choice-B', choice === 'B');
  }

  /* ---------------- ctx ---------------- */
  function makeCtx(def, el, beat, dir, instant) {
    var ctx = {
      el: el, scene: def, beat: beat, dir: dir, instant: !!instant,
      /* snapshot: a debug/export render (debug.goto). Live back-steps and G jumps are instant but NOT snapshots,
         so ring countdowns still run there. */
      snapshot: !!(instant && live.snapshot),
      arriving: !!(el && el.classList.contains('arriving')),
      reducedMotion: A.isRM(), state: st, gen: gen,
      $: function (s) { return el.querySelector(s); },
      $$: function (s) { return Array.prototype.slice.call(el.querySelectorAll(s)); },
      choice: function () { return st.choices[def.id] || null; }
    };
    var fx = A.fx || {};
    Object.keys(fx).forEach(function (k) {
      if (typeof fx[k] === 'function') ctx[k] = function () {
        var args = [ctx].concat(Array.prototype.slice.call(arguments));
        return fx[k].apply(null, args);
      };
    });
    return ctx;
  }
  function safeCall(def, name, args) {
    if (!def || typeof def[name] !== 'function') return;
    try { def[name].apply(def, args); } catch (e) { console.error('[ALLIN] ' + def.id + '.' + name + ' failed', e); }
  }

  /* ---------------- mounting ---------------- */
  /* keep: the element stays in the DOM (class .leaving) so a transition can retract it; neural.js removes it */
  function unmount(keep) {
    if (!live.el) return null;
    var el = live.el;
    safeCall(live.def, 'onLeave', [makeCtx(live.def, el, st.beat, 0, true)]);
    live.timers.forEach(function (id) { clearInterval(id); clearTimeout(id); });
    live.timers = [];
    live.ambient = [];
    live.loops = [];
    live.el = null;
    if (keep && el.parentNode) { el.classList.add('leaving'); el.classList.remove('arriving'); return el; }
    if (el.parentNode) el.parentNode.removeChild(el);
    return null;
  }

  function finishFinite(root) {
    var anims = root.getAnimations ? root.getAnimations({ subtree: true }) : [];
    for (var i = 0; i < anims.length; i++) {
      var a = anims[i];
      if (live.ambient.indexOf(a) >= 0) continue;
      var t = a.effect && a.effect.getComputedTiming ? a.effect.getComputedTiming() : null;
      if (t && isFinite(t.endTime)) { try { a.finish(); } catch (e) { /* ignore */ } }
    }
  }

  /* Drop .instant from an instantly-mounted scene. While .instant is on, CSS entry effects are held at their end state;
     lifting it would (re)start them from their first frame, so a Left / G / goto render would replay them. The
     animations that start because the class went away are finished on the spot (they land on their end state). */
  function liftInstant(el) {
    if (!el || !el.classList.contains('instant')) return;
    var before = el.getAnimations ? el.getAnimations({ subtree: true }) : [];
    el.classList.remove('instant');
    if (!el.getAnimations) return;
    var after = el.getAnimations({ subtree: true });
    for (var i = 0; i < after.length; i++) {
      var a = after[i];
      if (before.indexOf(a) >= 0 || live.ambient.indexOf(a) >= 0) continue;
      var t = a.effect && a.effect.getComputedTiming ? a.effect.getComputedTiming() : null;
      if (t && isFinite(t.endTime)) { try { a.finish(); } catch (e) { /* ignore */ } }
    }
  }

  function cutOf(def) {
    var c = def.cut || 'hop';
    return CUTS[c] ? c : 'hop';
  }

  function layersEntry(el, instant) {
    var layers = el.querySelectorAll('.layer[data-depth]');
    var m = A.motion(), rm = A.isRM();
    for (var i = 0; i < layers.length; i++) {
      var d = parseFloat(layers[i].getAttribute('data-depth')) || 0;
      if (!instant && d > 0) {
        layers[i].animate([{ translate: (d * 14) + 'px 0' }, { translate: '0px 0' }], { duration: 900 * m, easing: EASE });
      }
      if (d === 0 && !rm) {
        A._loop(layers[i].animate([{ scale: '1' }, { scale: '1.02' }], { duration: 20000, easing: 'ease-in-out', fill: 'forwards' }));
      }
    }
  }

  function beatState(def, el, b, dir, instant) {
    st.beat = b;
    var choice = st.choices[def.id] || null;
    setBeatClasses(el, def, b, choice);
    applyReveals(el, b, choice, instant);
    safeCall(def, 'onBeat', [b, makeCtx(def, el, b, dir, instant)]);
  }

  /* Landing: the scene becomes visible. .arriving -> .landed, beat-0 reveals + onBeat(0..beat), 'beat' + 'land'
     events, def.onLand(ctx). Transitions call this at their landing moment; every other mount calls it at once. */
  function land(def, el, dir, instant, beat) {
    beat = beat | 0;
    live.landed = true;
    el.classList.remove('arriving');
    el.classList.add('landed');
    layersEntry(el, instant);
    for (var b = 0; b <= beat; b++) beatState(def, el, b, dir, instant);
    var ctx = makeCtx(def, el, st.beat, dir, instant);
    A.emit('beat', { def: def, index: st.sceneIndex, beat: st.beat, dir: dir, instant: instant, entry: true });
    A.emit('land', { def: def, el: el, index: st.sceneIndex, instant: instant });
    safeCall(def, 'onLand', [ctx]);
  }

  function newSection(def, instant, kind) {
    var el = document.createElement('section');
    el.className = 'scene' + (instant ? ' instant' : '') + (kind ? ' arriving' : '');
    el.setAttribute('data-id', def.id);
    el.setAttribute('data-mood', def.mood);
    return el;
  }
  function sceneHtml(def, ctx) {
    var html = '';
    try { html = typeof def.html === 'function' ? def.html(ctx) : (def.html || ''); }
    catch (e) { console.error('[ALLIN] ' + def.id + '.html failed', e); }
    return html || '';
  }

  /* ---------------- idle preparation of the next scene and of the cut into it ----------------
     (round-1 T3; repair round 1: pre-mount on the last beat; repair round 2: staged, earlier, onPremount, the cut.)
     So a forward press only STARTS the cut, everything it needs is made while the presenter talks, in small idle steps
     (one per idle callback, timeout 80 ms, never while a cut flies), re-checked before each step:
       1. pre-mount: the NEXT scene is built in exactly the state mount() would give it (markup, hidden reveals, beat-0
          classes, --land-x/-y) and APPENDED to #scenes, invisible (.arriving is opacity 0), marked data-pre +
          aria-hidden. Its style, layout and text shaping happen in the next frame, not in the key press (a kit scene's
          append + style + layout is ~5 ms at 1x, ~30 ms at 4x CPU). Made 1.7 s after an animated landing (after the
          landing draw-on; 0.5 s under reduced motion), 0.1 s after an instant mount (Left, G, Home / End, boot), 0.7 s
          after a beat, 0.1 s after the scene's last beat; kept across the scene's beats.
       2. on the scene's LAST beat: the cut's own preparation (ALLIN.neural.prepareCut: exit sample points, the retract,
          the cut's geometry, the journey card's words).
       3. once, a frame after the append: def.onPremount(ctx) (the scene's own idle work, e.g. the kit's line layout,
          landing order and PAUSED draw-on animations) with the very ctx its html(ctx) got (ctx.el = the hidden section,
          ctx.arriving true, ctx.land set), then the 'premount' event {def, el}. If the press comes first, onPremount is
          never called for that element: the scene arrives through onEnter as it would without a pre-mount.
     Keyed by everything html() may read: the mount generation, the scene on screen, the choices, reduced motion (not its
     beat: html(ctx) is a pure string builder for the NEXT scene). Any other mount drops the pre-mount, and nothing of
     it is left behind (removed, every animation made on its elements cancelled). Tools counting scenes:
     `#scenes > .scene:not([data-pre])`, or ALLIN.liveEl(). ALLIN.debug.prep() reports the steps (times in ms). */
  var pre = null, PREP = { timer: 0, idle: 0, tok: 0, log: [] };
  var PREP_TIMEOUT = 80;
  function preKey() { return gen + '|' + st.sceneIndex + '|' + A.isRM() + '|' + JSON.stringify(st.choices); }
  function dropPre() {
    var p = pre;
    pre = null;
    if (!p || !p.el) return;
    if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
    // detached first, so this cannot force a style pass: the animations a scene made on its own pre-mounted elements
    // (the kit's paused draw-on) are cancelled, so nothing of a dropped pre-mount outlives it
    try {
      var an = p.el.getAnimations ? p.el.getAnimations({ subtree: true }) : [];
      for (var i = 0; i < an.length; i++) an[i].cancel();
    } catch (e) { /* ignore */ }
  }
  function prepLog(step, ms) { PREP.log.push({ step: step, at: Math.round(performance.now()), ms: +ms.toFixed(2), scene: live.def ? live.def.id : null, beat: st.beat }); if (PREP.log.length > 40) PREP.log.shift(); }
  function cancelPrep() {
    PREP.tok++;
    clearTimeout(PREP.timer); PREP.timer = 0;
    if (PREP.idle && window.cancelIdleCallback) { try { window.cancelIdleCallback(PREP.idle); } catch (e) { /* ignore */ } }
    PREP.idle = 0;
  }
  function schedulePrep(delay) {
    cancelPrep();
    var tok = PREP.tok;
    PREP.timer = setTimeout(function () { PREP.timer = 0; if (tok === PREP.tok) prepIdle(tok); }, Math.max(0, delay | 0));
  }
  function prepIdle(tok) {
    var run = function () { PREP.idle = 0; if (tok === PREP.tok) prepRun(tok); };
    if (window.requestIdleCallback) PREP.idle = window.requestIdleCallback(run, { timeout: PREP_TIMEOUT });
    else PREP.timer = setTimeout(run, 16);
  }
  function prepRun(tok) {
    if (A.neural && A.neural.active && A.neural.active()) { schedulePrep(150); return; }   // never while a cut flies
    var r = false;
    try { r = prepStep(); } catch (e) { console.error('[ALLIN] idle preparation failed', e); }
    if (r === 'frame') {
      // the append's style + layout happen in the next frame: the next step waits for it (two frames)
      requestAnimationFrame(function () { requestAnimationFrame(function () { if (tok === PREP.tok) prepIdle(tok); }); });
    } else if (r) prepIdle(tok);
  }
  function prepStep() {
    var idx = st.sceneIndex + 1, def = defs[idx];
    if (!def || !live.def || !live.el || !live.landed) return false;
    var cut = cutOf(def);
    if (cut === 'hard') return false;
    var t0 = performance.now(), key = preKey();
    if (!pre || pre.idx !== idx || pre.key !== key || pre.el.parentNode !== dom.scenes) {
      buildPre(idx, def, cut, key);
      prepLog('premount-build ' + def.id, performance.now() - t0);
      return 'frame';
    }
    var cutKey = st.beat + '|' + A.isRM();
    if (st.beat >= live.def.beats - 1 && pre.cutKey !== cutKey) {
      pre.cutKey = cutKey;
      if (A.neural && A.neural.prepareCut) A.neural.prepareCut(live.el, live.def, def, cut);
      prepLog('cut ' + live.def.id + '->' + def.id, performance.now() - t0);
      return true;
    }
    if (!pre.prepared) {
      pre.prepared = true;
      safeCall(def, 'onPremount', [pre.ctx]);
      A.emit('premount', { def: def, el: pre.el });
      prepLog('onPremount ' + def.id, performance.now() - t0);
      return true;
    }
    return false;
  }
  function buildPre(idx, def, cut, key) {
    dropPre();
    var el = newSection(def, false, cut);
    var lp = A.neural && A.neural.landFor ? A.neural.landFor(live.def, def, cut) : null;
    if (lp) { el.style.setProperty('--land-x', Math.round(lp.x) + 'px'); el.style.setProperty('--land-y', Math.round(lp.y) + 'px'); }
    var ctx = makeCtx(def, el, 0, 1, false);
    ctx.arriving = true; ctx.land = lp ? { x: Math.round(lp.x), y: Math.round(lp.y) } : null;
    el.innerHTML = sceneHtml(def, ctx);
    // what mount() does before it appends: everything with data-in waits hidden, branch mismatches are off, beat 0
    var choice = st.choices[def.id] || null, list = el.querySelectorAll(RV_SEL);
    for (var i = 0; i < list.length; i++) list[i].setAttribute('data-rv', rvTarget(list[i], -1, choice));
    setBeatClasses(el, def, 0, choice);
    el.setAttribute('data-pre', '');
    el.setAttribute('aria-hidden', 'true');
    dom.scenes.appendChild(el);
    pre = { idx: idx, key: key, el: el, def: def, ctx: ctx, prepared: false, cutKey: null };
  }
  /* when the idle preparation runs: after a landing (animated: once its draw-on is done), an instant mount or a beat */
  function onBeatPrep(e) {
    if (!e || !live.def) return;
    var last = st.beat >= live.def.beats - 1;
    if (e.entry) schedulePrep(e.instant ? 100 : (A.isRM() ? 500 : 1700));
    else schedulePrep(last ? 100 : 700);
  }

  /* opts: { instant, dir, transition: 'hop'|'journey'|'opening'|'fade' (animated change), held: ms (debug frame),
     snapshot, boot }. Without a transition the scene lands at once ('hard' cut, instant mounts, boot). */
  function mount(idx, beat, opts) {
    opts = opts || {};
    var instant = !!opts.instant, dir = opts.dir || 0;
    var def = defs[idx];
    if (!def) return;
    var kind = !instant && opts.transition && opts.transition !== 'hard' && A.neural && A.neural.play ? opts.transition : null;
    beat = kind ? 0 : Math.max(0, Math.min(def.beats - 1, beat | 0));
    // the cut's exit sample points are read from the old scene NOW, while the DOM is still clean (after the next scene
    // is appended, reading SVG geometry would force a style + layout pass over it inside the key handler)
    if (kind && live.el && A.neural.prepareLeave) A.neural.prepareLeave(live.el, live.def);
    if (A.neural) { A.neural.abort(); A.neural.clearSparks(); }
    cancelPrep();
    var prevDef = live.def;
    // the next scene may already be built and appended (idle pre-mount, T3); only valid for this exact situation.
    // Any other mount drops it (Left, G, Home / End, goto: it must never outlive the scene it was built for)
    var preEl = kind && pre && pre.idx === idx && pre.key === preKey() && pre.el.parentNode === dom.scenes ? pre.el : null;
    if (preEl) pre = null; else dropPre();
    if (prevDef !== def) ringMemo = {};
    A.emit('leave', { def: prevDef });
    var oldEl = unmount(!!kind);
    gen++;
    st.sceneIndex = idx;
    st.beat = beat;
    live.def = def;
    live.mountedAt = Date.now();
    live.snapshot = !!(instant && opts.snapshot);
    live.landed = false;

    // a choice scene shown at/after its branch beat always has a branch (inherited; unused in this show)
    if (def.choice && beat >= def.choice.branchBeat && !st.choices[def.id]) st.choices[def.id] = defaultChoice(def);

    if (instant) dom.stage.classList.add('snap');
    dom.stage.setAttribute('data-mood', def.mood);

/* ---- scenes/_kit.js ---- */
/* src/scenes/_kit.js — the Glowline scene kit (art kit). window.ALLIN.kit (K below). Built after src/art/components.js
 * and before the numbered scenes. Pairs with src/scenes/_kit.css and src/art/art.css. Contract: notes/BRIEF.md §§ 3-5.
 * THE SCENE BUILDER'S GUIDE IS notes/KIT.md (scene hooks, API with examples, layout grid, colour meanings, people rules,
 * the cue rule, line rules, text glyphs, the draw API and the landing, drawings with parts, adding a drawing, the symbol
 * list, the self-check list). Templates: src/scenes/s06.js (+ .css) and src/scenes/s10.js (+ .css).
 *
 * Every markup helper returns an HTML string for a scene's html(ctx) (a pure string builder: it also runs on idle for
 * the engine's pre-mount). Reveal options accepted everywhere:
 *   { in, out, only, fx, d, dur, cls, style, attrs, hot }  -> data-in / data-out / data-only / data-fx / --d / --dur /
 *   data-hot (engine reveals: reversible, correct on Left / G / screenshots). Glowline drawings inside a reveal draw
 *   themselves on when it turns on; beat-0 content draws / condenses when the scene lands. Under .instant all is at its
 *   end state.
 *
 * RULES the kit enforces or supports (details and reasons in notes/KIT.md):
 *  - Lines: at most 3 visible (the oldest leaves), each <= 2 rows (choose lw), text-wrap: balance. Earlier lines settle.
 *  - Phrase protection: a no-break space (U+00A0) or "\n" (a real newline or the two characters \ and n) in a title /
 *    line / label: "\n" becomes a line break that keeps one space.
 *  - Display glyphs (render time only; sources stay verbatim): letter-hyphen-letter -> U+2011 (never breaks), a
 *    word-internal straight apostrophe -> U+2019 ("that’s"). K.term and every string check match with K.norm:
 *    U+00A0 -> space, U+2011 -> hyphen, U+2019 -> apostrophe. An unmatched term logs a [kit] warning.
 *  - The cue rule: --cue art rests at opacity .55; it reaches 1 only on the beats where it is the subject
 *    (hot: 1 or hot: [1, 3] -> data-hot="1 3", or hot: true -> always) and while it fires (.k-firing).
 *  - Landing (review V12): every beat-0 drawing draws itself from the landing point (--land-x / --land-y), nearest
 *    strokes first, each from its nearer end, all complete <= 1.6 s after landing (K.LAND). The kit PREPARES it before
 *    the scene is seen (K.scene onPremount at the engine's idle pre-mount, else onEnter while the cut flies: line
 *    layout, landing order, every draw-on built PAUSED) and the landing only STARTS the animations due within two
 *    frames; a rAF pump starts the rest just in time with the same start time. Never start a draw-on with a CSS rule
 *    keyed on .landed / .arriving (it restyles every stroke in the landing frame). Later-beat draw-ons keep the authored
 *    order and are built on the frame after the key press.
 *  - Beats read no layout inside the key press: sparks and firings measure their ends on the next frame; the line axons
 *    are measured at the preparation / an instant mount / a font load only (review BEAT).
 *  - Sparks are given ELEMENTS (never pre-measured points), so the engine can follow a target that is still moving.
 *  - First-use warm-up (review CARD): once on idle after boot, an invisible copy of every blurred / blended kit style is
 *    rasterised (K.warmUp), so the first glossary card does not pay the GPU's shader compiles live.
 *  - People: no faces, no real people, nothing body-focused. Woman figures are --signal or --bone when she is a
 *    participant; --cue only for the watcher manipulation (S15), and only as a distant outline. Findings are men's
 *    choices, never women's fault.
 *
 * API (one line each; examples in notes/KIT.md § 10)
 *  K.scene(def)                ALLIN.scene + the kit's hooks (onPremount, onEnter: prepare the landing; onBeat: K.beat)
 *  K.head(title, lines, o)     title + beat lines flowing under it. o: chips, lw (780), lineGap, titleW, x, y, max
 *  K.title(text, o)            the title alone (o.size 'hero' = 200 px)
 *  K.lines(items, o) / K.line  the line stack alone / one free line (size 'q' = question, 116 px)
 *     item: 'text' | { t, in, out, only, d, term, card, accent, color, spark, fire, hot }
 *  K.term(text, term)          inline markup with `term` in --signal (matched with K.norm)
 *  K.label(text, o)            picture label 44 px: { x, y, align l|r|c, color, in, out, d }
 *  K.cite(text, o)             citation bottom-left, 32 px --mist (o.small: 30 px)
 *  K.pic(id, o)                a glowline drawing in a box: { x, y, w, h | zone, align, color, accent, weight, state,
 *                              fire, hot, order, spark, label, step, svgCls, + reveal opts }
 *  K.box(id, o) / K.at(id, o, anchor)   the box K.pic would use / the stage px of a named anchor
 *  K.pt(id, o, anchor)         the same anchor as a lazy {x, y} for def.land / def.exit (resolved when a cut starts)
 *  K.spot(o) / K.dots(n, o)    a glowing Gas / Brake spot / a grid / cloud / line of dots
 *  K.options(labels, o)        2-4 option nodes for hand votes
 *  K.chips(o)                  score chips (A amber, B green); { a, b: n | [from, to], at } -> fires + rolls at `at`
 *  K.stat(num, label, o) / K.column(o) / K.ring(o) / K.bar(o)
 *  K.txt(s) / K.disp(s) / K.norm(s) / K.esc(s) / K.rv(o)   text for your own markup / glyphs only / the comparison form /
 *                              escaping / reveal attributes
 *  K.beat(b, ctx)              per beat (K.scene calls it): timers, sparks, firings
 *  K.fire(ctx, el, o)          firing: bloom + ring ripple (+ .k-firing while it plays), measured on the next frame
 *  K.spark(ctx, from, to, o)   ALLIN.fx.spark with elements, started on the next frame (resolves at once when instant)
 *  K.prepare(root, via) / K.layoutLines(root) / K.landOrder(root) / K.lastLand / K.warmUp()   for the engine and tools
 *
 * Checker attributes set by the kit: data-role="title"|"line"|"label"|"cite"|"chip", data-num="dynamic" on timers.
 */

  var A = window.ALLIN = window.ALLIN || {};

  /* ------------------------------------------------------------------ utilities */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  --signal: #8FF3FF;         /* the travelling signal, transmitter, UI accent, neutral highlights */
  --gas: #7DFFA0;            /* reward / gas pedal (nucleus accumbens) / Story B */
  --brake: #7FB2FF;          /* caution / brake (anterior insula) */
  --show: #FFC45E;           /* showing off / peacock / Story A */
  --cue: #FF5FAE;            /* the attractive cue (photo, ad frame). ART ONLY */

  /* aliases kept so the inherited ALL IN engine/overlay CSS keeps working until it is restyled */
  --ink: var(--void);
  --smoke: var(--tissue);
  --amber: var(--show);
  --lab: var(--signal);
  --money: var(--gas);
  --warn: var(--show);
  --her: var(--cue);
  --night: var(--tissue);
  --black: #000;

  /* ---------- Type ----------
     Display: Bai Jamjuree (Cadson Demak; Thai + Latin, has the baht sign). Reading text: Anuphan (Cadson Demak).
     Sentence case everywhere. No all-caps labels. Minimums are measured at 1920x1080. */
  --font-display: 'Bai Jamjuree', 'Anuphan', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'Anuphan', 'Bai Jamjuree', 'Segoe UI', Tahoma, sans-serif;
  --ls-display: -0.012em;    /* display tracking: journey question cards (116 px), big display lines */
  --ls-hero: -0.02em;        /* the S1 hero title (200 px) */
  --fs-hero: 200px;          /* S1 "Pretty risky?" */
  --fs-question: 116px;      /* journey question cards (>= 104) */
  --fs-display: 116px;       /* alias used by inherited CSS */
  --fs-title: 76px;          /* scene titles: sentence headlines, max 2 lines (>= 68) */
  --fs-stat: 150px;          /* big numbers: 42 of 43, ≈ 0 */
  --fs-line: 52px;           /* beat lines (Anuphan 600) (>= 46) */
  --fs-body: 44px;           /* labels, chips, option nodes (>= 40) */
  --fs-caption: 40px;        /* glossary terms */
  --fs-cite: 32px;           /* on-screen citations (>= 30) */
  --fs-ref: 32px;            /* reference list only */
  --fs-slate: 116px;
  --fs-stamp: 140px;

  /* ---------- Motion ---------- */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
  --ease-slam: cubic-bezier(.55, 0, .9, .3);
  --ease-draw: cubic-bezier(.45, .05, .25, 1);   /* glowline draw-on */
  --t-reveal: 560ms;
  --t-draw: 900ms;
  --t-enter: 350ms;
  --t-bars: 400ms;
  --motion: 1;               /* x0.3 under reduced motion (.rm on <html>) */

  /* ---------- Glowline strokes ---------- */
  --gl-core: 5px;            /* core stroke at the drawing's 1:1 size */
  --gl-halo: 18px;           /* halo stroke under the core (low opacity, no filter) */
  --gl-halo-a: .16;

  /* no letterbox in this show; kept for inherited CSS */
  --bar-h: 0px;
}
html.rm { --motion: .3; }
/* ---- base.css ---- */
/* Pretty risky? — base (engine-owned): stage, moods, world canvases, microscope vignette, grain, scene states
   (.arriving / .landed / .leaving / .instant), declarative reveals, the journey question card + progress line,
   presenter overlays. Look: notes/BRIEF.md § 3 ("Glowline"). API: notes/ENGINE.md. */

@property --d   { syntax: '<time>'; inherits: false; initial-value: 0ms; }
@property --dur { syntax: '<time>'; inherits: false; initial-value: 560ms; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body {
  color: var(--bone);
  font-family: var(--font-body);
  font-weight: 600;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-kerning: normal;
}
/* cursor auto-hide (overlays.js): a transparent shield over the whole window, shown 2 s after the last mouse move. Never
   a class on <html> with a `*` rule: that restyled the whole document on every toggle (repair round 1, T3). */
#cursor-shield { position: fixed; inset: 0; z-index: 2147483000; display: none; cursor: none; background: transparent; }
#cursor-shield.on { display: block; }

/* ---------- stage ---------- */
#viewport { position: fixed; inset: 0; background: #000; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%);
  transform-origin: 50% 50%;
  overflow: hidden;
  background: var(--void);
  font-size: var(--fs-body);
  line-height: 1.2;
  contain: layout paint style;
  isolation: isolate;
}
/* moods: void (S0, black), tissue (default), room (S26-S28: the field dims, the room talks), credits (S29-S30) */
#stage[data-mood="void"] { background: #000; }
#stage[data-mood="credits"] { background: #03040A; }

/* layer order: world canvas < microscope vignette < scenes < top canvas (sparks) < journey card < grain */
#world, #fx-top { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; pointer-events: none; }
#world { z-index: 0; }
#fx-vignette { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
#scenes { position: absolute; inset: 0; z-index: 2; }
#fx-top { z-index: 3; }
#fx-journey { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#fx-grain { z-index: 5; }

.scene { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.layer.bleed { inset: 0 -80px; }
.layer[data-depth="0"] { transform-origin: 50% 50%; }

/* ---------- scene states (engine) ----------
   .arriving : mounted while a transition is still flying: invisible.
   .landed   : the transition landed (or an instant mount): beat-0 entry animations key off it.
   .leaving  : the scene we are leaving: neural.js fades it out (display:none once faded). With .retract (every
               animated cut except under reduced motion) every visible glowline stroke (pathLength="1") un-draws back
               along itself: ONE Web Animation per stroke, built idle before the press (neural.js buildRetract) and
               played when the cut starts (held debug frames seek it). No CSS rule may key on .leaving / .retract below
               the scene root: such a rule restyles every stroke inside the key press (repair round 1, T3: leaving a
               kit scene was one 297 ms frame at 4x CPU). Removed when its cut ends.
   No inherited property on these state classes: `pointer-events: none` (inherited) on .arriving / .leaving restyled
   the whole scene subtree when the class came or went, inside the key press and the landing (8-37 ms at 4x CPU for a
   kit scene; repair round 1, T3 / V12). Clicks do nothing in this show, so the leaving and arriving scenes need no
   pointer guard. */
.scene.arriving { opacity: 0; }

/* ---------- microscope field: a soft round vignette that tightens while we travel ---------- */
#fx-vignette::before, #fx-vignette::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
#fx-vignette::before {
  background: radial-gradient(ellipse 64% 82% at 50% 50%, rgba(2,3,8,0) 58%, rgba(2,3,8,.34) 80%, rgba(2,3,8,.7) 100%);
}
#fx-vignette::after {
  opacity: 0; transition: opacity calc(320ms * var(--motion)) var(--ease);
  background: radial-gradient(ellipse 60% 78% at 50% 50%, rgba(2,3,8,0) 62%, rgba(2,3,8,.26) 84%, rgba(2,3,8,.55) 100%);
}
#stage.travelling #fx-vignette::after { opacity: 1; }
#stage[data-mood="void"] #fx-vignette { opacity: 0; }

/* ---------- fine grain ---------- */
#fx-grain {
  position: absolute; inset: -96px; pointer-events: none;
  opacity: .035; background-repeat: repeat; background-size: 256px 256px;
  animation: grain-jitter 1s steps(1, end) infinite;
}
@keyframes grain-jitter {
  0%    { transform: translate(0, 0); }
  12.5% { transform: translate(-41px, 23px); }
  25%   { transform: translate(37px, -55px); }
  37.5% { transform: translate(-63px, -17px); }
  50%   { transform: translate(19px, 61px); }
  62.5% { transform: translate(-29px, -71px); }
  75%   { transform: translate(67px, 11px); }
  87.5% { transform: translate(-7px, 47px); }
}
#stage[data-mood="void"] #fx-grain { opacity: .025; }

/* snapping (backward / jump / export): no transitions anywhere in the frame */
#stage.snap #fx-vignette::after { transition: none !important; }
.scene.instant, .scene.instant * { transition: none !important; }

/* ---------- reduced motion: ambient loops frozen, reveals still happen (x0.3) ---------- */
html.rm #fx-grain, html.rm .loop, html.rm [data-loop] { animation-play-state: paused !important; }

/* ---------- declarative reveals (engine sets data-rv = pre | on | post | off) ---------- */
.scene [data-rv] {
  transition-property: opacity, translate, scale, clip-path;
  transition-duration: calc(var(--dur) * var(--motion));
  transition-delay: calc(var(--d) * var(--motion));
  transition-timing-function: var(--ease);
}
.scene [data-rv="off"] { display: none !important; }
.scene [data-rv="pre"]  { opacity: 0; translate: 0 24px; }                 /* rise (default) */
.scene [data-rv="pre"][data-fx="fade"],
.scene [data-rv="pre"][data-fx="flicker"],
.scene [data-rv="pre"][data-fx="wipe"] { translate: none; }
.scene [data-rv="pre"][data-fx="drop"]    { translate: 0 -24px; }
.scene [data-rv="pre"][data-fx="slide-l"] { translate: -64px 0; }
.scene [data-rv="pre"][data-fx="slide-r"] { translate: 64px 0; }
.scene [data-rv="pre"][data-fx="pop"]     { translate: none; scale: .82; }
.scene [data-rv][data-fx="pop"]           { transition-timing-function: var(--ease-pop); }
.scene [data-rv="pre"][data-fx="scale"]   { translate: none; scale: .94; }
.scene [data-rv="pre"][data-fx="stamp"]   { translate: none; }
.scene [data-rv="pre"][data-fx="condense"] { translate: 0 14px; }
.scene [data-rv="pre"][data-fx="wipe"]    { opacity: 1; clip-path: inset(-10% 100% -10% 0); }
.scene [data-rv="on"][data-fx="wipe"], .scene [data-rv="post"][data-fx="wipe"] { clip-path: inset(-10% 0 -10% 0); }
.scene [data-rv][data-fx="wipe"] { transition-timing-function: cubic-bezier(.65, 0, .25, 1); }
.scene [data-rv="on"][data-fx="flicker"] {
  animation: rv-flicker calc(var(--dur) * 1.4 * var(--motion)) linear calc(var(--d) * var(--motion)) backwards;
}
.scene [data-rv="on"][data-fx="stamp"] {
  animation: rv-stamp calc(var(--dur) * .6 * var(--motion)) var(--ease-slam) calc(var(--d) * var(--motion)) backwards;
}
.scene [data-rv="on"][data-fx="condense"] {
  animation: rv-condense calc(var(--dur) * var(--motion)) var(--ease) calc(var(--d) * var(--motion)) backwards;
}
.scene [data-rv="post"] {
  opacity: 0; translate: 0 -14px;
  transition-duration: calc(var(--dur) * .6 * var(--motion));
  transition-delay: 0ms;
}
.scene [data-rv="post"][data-fx="fade"] { translate: none; }
@keyframes rv-flicker {
  0% { opacity: 0; } 6% { opacity: .85; } 10% { opacity: .1; } 17% { opacity: .9; } 21% { opacity: .25; }
  34% { opacity: 1; } 40% { opacity: .45; } 46% { opacity: 1; } 100% { opacity: 1; }
}
@keyframes rv-stamp {
  0% { opacity: 0; scale: 1.9; } 55% { opacity: 1; scale: .94; } 75% { scale: 1.03; } 100% { opacity: 1; scale: 1; }
}
/* a text "condenses": opacity + 14 px rise + a brief glow (BRIEF § 4.1 step 4) */
@keyframes rv-condense {
  0% { text-shadow: 0 0 28px rgba(143,243,255,.0); }
  40% { text-shadow: 0 0 28px rgba(143,243,255,.55); }
  100% { text-shadow: 0 0 28px rgba(143,243,255,0); }
}

/* ---------- type helpers (sizes from tokens; sentence case, no tracking) ---------- */
.t-hero  { font: 700 var(--fs-hero)/1 var(--font-display); letter-spacing: var(--ls-hero); margin: 0; }
.t-q     { font: 700 var(--fs-question)/1.06 var(--font-display); letter-spacing: var(--ls-display); margin: 0; text-wrap: balance; }
.t-title { font: 700 var(--fs-title)/1.08 var(--font-display); margin: 0; text-wrap: balance; }
.t-stat  { font: 700 var(--fs-stat)/1 var(--font-display); margin: 0; font-variant-numeric: tabular-nums; }
.t-line  { font: 600 var(--fs-line)/1.18 var(--font-body); margin: 0; text-wrap: pretty; }
.t-label { font: 600 var(--fs-body)/1.15 var(--font-body); margin: 0; }
.t-caption { font: 600 var(--fs-caption)/1.2 var(--font-body); margin: 0; }
.t-cite  { font: 500 var(--fs-cite)/1.25 var(--font-body); color: var(--mist); margin: 0; }
.t-bone { color: var(--bone); } .t-mist { color: var(--mist); } .t-signal { color: var(--signal); }
.t-gas { color: var(--gas); } .t-brake { color: var(--brake); } .t-show { color: var(--show); }
/* text over art: soft dark scrim behind it */
.scrim { position: relative; isolation: isolate; }
.scrim::before {
  content: ''; position: absolute; inset: -40px -80px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(5,7,15,.84), rgba(5,7,15,.56) 60%, rgba(5,7,15,0));
}
/* the safe area (x 96-1824, y 64-1016) as an absolute box */
.safe { position: absolute; left: 96px; top: 64px; width: 1728px; height: 952px; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.stack > * + * { margin-top: 28px; }

/* ---------- ring countdown (ctx.ring) ---------- */
.ring { position: relative; width: 220px; height: 220px; }
.ring .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .ring-track { fill: none; stroke: rgba(168,182,230,.16); stroke-width: 10; }
.ring .ring-prog  { fill: none; stroke: var(--ring-color, var(--signal)); stroke-width: 10; stroke-linecap: round; }
.ring.ring-low .ring-prog { stroke: var(--show); }
.ring.ring-done .ring-prog { opacity: 0; }
.ring .ring-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 700 var(--ring-num, 88px)/1 var(--font-display); color: var(--bone); font-variant-numeric: tabular-nums;
}
.ring.ring-low .ring-num { color: var(--show); }

/* ======================================================================
   Journey: the section question card + the six-node progress line (driven by neural.js)
   ====================================================================== */
#fx-journey { visibility: hidden; }
#fx-journey.on { visibility: visible; }
/* the scrim covers the text block only, so the flight stays visible around it (round-1 V2); cells passing behind the
   text are dimmed on the canvas (neural.js QRECT), the progress band is cut there too (BAND) */
#fx-journey .jr-scrim {
  position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 900px 230px at 50% 47%, rgba(5,7,15,.8), rgba(5,7,15,.5) 60%, rgba(5,7,15,0) 100%);
}
#fx-journey .jr-q {
  position: absolute; left: 150px; right: 150px; top: 0; bottom: 140px; opacity: 0;
  display: flex; align-items: center; justify-content: center; text-align: center; flex-wrap: wrap;
  font: 700 var(--fs-question)/1.08 var(--font-display); letter-spacing: var(--ls-display); color: var(--bone); text-wrap: balance;
  padding-top: 60px;
}
#fx-journey .jr-qi { margin: 0; max-width: 1560px; text-wrap: balance; }
#fx-journey .jr-qk { color: var(--signal); }
/* the cyan label on its own line when the question part fits one line (neural.js cardText, repair round 2 QWRAP) */
#fx-journey .jr-qi.split .jr-qk { display: block; }
#fx-journey .jr-band {
  position: absolute; left: 0; right: 0; bottom: 0; height: 150px; opacity: 0;
  background: linear-gradient(0deg, rgba(5,7,15,.88), rgba(5,7,15,.6) 55%, rgba(5,7,15,0));
}
#fx-journey .jr-prog { position: absolute; left: 0; top: 930px; width: 1920px; height: 140px; opacity: 0; }
#fx-journey .jr-svg { position: absolute; left: 0; top: 0; overflow: visible; }
#fx-journey .jr-label {
  position: absolute; top: -2px; transform: translateX(-50%); white-space: nowrap;
  font: 600 40px/1 var(--font-body); color: var(--mist);
}
#fx-journey .jr-label.cur { color: var(--bone); }
#fx-journey .jr-lead, #fx-journey .jr-tail { fill: none; stroke: var(--membrane); stroke-width: 4; stroke-linecap: round; }
#fx-journey .jr-lead { stroke: rgba(143,243,255,.45); }
#fx-journey .jr-sheath { fill: rgba(127,178,255,.05); stroke: #3A4E92; stroke-width: 2.5; }
#fx-journey .jr-sheath.past { stroke: rgba(143,243,255,.5); fill: rgba(143,243,255,.08); }
#fx-journey .jr-node { stroke-width: 3; }
#fx-journey .jr-node.next { fill: var(--void); stroke: #4A5A92; }
#fx-journey .jr-node.past { fill: rgba(143,243,255,.42); stroke: rgba(143,243,255,.6); }
#fx-journey .jr-node.cur  { fill: var(--signal); stroke: #E6FDFF; r: 12px; }
#fx-journey .jr-ring { fill: none; stroke: var(--signal); stroke-width: 3; opacity: 0; }
#fx-journey .jr-glow { fill: rgba(143,243,255,.28); }
#fx-journey .jr-dot  { fill: #F4FEFF; }

/* ======================================================================
   Presenter overlays inside the stage (show of hands, notes, jump, hint)
   ====================================================================== */
.ov { position: absolute; inset: 0; z-index: 40; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity calc(260ms * var(--motion)) var(--ease), visibility 0s linear calc(260ms * var(--motion)); }
.ov.open { opacity: 1; visibility: visible; transition: opacity calc(260ms * var(--motion)) var(--ease), visibility 0s; }

/* ---- S0 load hint ---- */
#hint {
  position: absolute; left: 0; right: 0; top: 50%; z-index: 30; transform: translateY(-50%);
  text-align: center; font: 500 40px/1.3 var(--font-body); color: var(--bone);
  opacity: 0; pointer-events: none;
}
#hint.show { opacity: 1; transition: opacity calc(500ms * var(--motion)) var(--ease); }
#hint.dim  { opacity: .08; transition: opacity calc(1600ms * var(--motion)) ease-in-out; }

/* ---- show-of-hands board (P) ---- */
#ov-poll {
  z-index: 50;
  background:
    radial-gradient(70% 60% at 50% 38%, rgba(143,243,255,.06), rgba(143,243,255,0) 70%),
    radial-gradient(ellipse at 50% 45%, var(--tissue), #03050C 75%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 72px 96px 96px;
}
#ov-poll .poll-kicker {
  font: 700 64px/1 var(--font-display); color: var(--signal);
  display: flex; align-items: center; gap: 28px;
}
#ov-poll .poll-kicker::before, #ov-poll .poll-kicker::after { content: ''; width: 120px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(143,243,255,0), rgba(143,243,255,.8)); }
#ov-poll .poll-kicker::after { transform: scaleX(-1); }
#ov-poll .poll-q {
  margin: 36px 0 0; max-width: 1560px; text-align: center; text-wrap: balance;
  font: 700 66px/1.14 var(--font-display); color: var(--bone);
}
#ov-poll .poll-cols { display: flex; justify-content: center; align-items: stretch; margin-top: 72px; }
#ov-poll .poll-col {
  position: relative; width: 560px; padding: 0 40px; display: flex; flex-direction: column; align-items: center;
  border-left: 2px solid rgba(168,182,230,.14);
}
#ov-poll .poll-cols.n3 .poll-col { width: 540px; }
#ov-poll .poll-col:first-child { border-left: 0; }
#ov-poll .poll-label { font: 700 104px/1 var(--font-display); color: var(--signal); }
#ov-poll .poll-sub { margin-top: 10px; font: 600 42px/1.2 var(--font-body); color: var(--bone); text-align: center; }
#ov-poll .poll-nums { display: flex; align-items: flex-end; justify-content: center; gap: 48px; margin-top: 18px; }
#ov-poll .poll-count {
  display: block; font: 700 260px/.95 var(--font-display); color: var(--bone);
  font-variant-numeric: tabular-nums; transition: color .3s, text-shadow .3s;
}
#ov-poll .poll-col.lead .poll-count { color: var(--signal); text-shadow: 0 0 60px rgba(143,243,255,.35); }
#ov-poll .poll-col.lead::before {
  content: ''; position: absolute; top: -30px; left: 50%; width: 120px; height: 6px; margin-left: -60px; border-radius: 3px;
  background: var(--signal); box-shadow: 0 0 24px rgba(143,243,255,.7);
}
#ov-poll .poll-nums.cmp {
  display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; column-gap: 22px; row-gap: 6px;
  justify-items: center; align-items: center; margin-top: 30px;
}
#ov-poll .pc-tag { grid-row: 1; font: 600 40px/1 var(--font-body); color: var(--signal); }
#ov-poll .pc-tag.pc-b { grid-column: 1; color: var(--mist); }
#ov-poll .pc-tag.pc-a { grid-column: 3; }
#ov-poll .cmp .pc-bnum, #ov-poll .cmp .poll-count { grid-row: 2; font: 700 180px/.95 var(--font-display); }
#ov-poll .pc-bnum { display: block; grid-column: 1; color: var(--mist); font-variant-numeric: tabular-nums; }
#ov-poll .cmp .poll-count { grid-column: 3; }
#ov-poll .pc-arrow { grid-row: 2; grid-column: 2; position: relative; width: 54px; height: 26px; margin-bottom: .2em; color: rgba(168,182,230,.6); }
#ov-poll .pc-arrow::before { content: ''; position: absolute; left: 0; right: 12px; top: 11px; height: 4px; border-radius: 2px; background: currentColor; }
#ov-poll .pc-arrow::after { content: ''; position: absolute; right: 3px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  border-top: 4px solid currentColor; border-right: 4px solid currentColor; transform: rotate(45deg); border-radius: 1px; }
#ov-poll .poll-key {
  margin-top: 30px; min-width: 64px; height: 64px; padding: 0 16px; border-radius: 14px;
  border: 2px solid rgba(168,182,230,.2); color: rgba(168,182,230,.6);
  font: 600 40px/60px var(--font-body); text-align: center; opacity: .6; transition: opacity .8s ease-out;
}
#ov-poll.keys-off .poll-key { opacity: 0; }
#ov-poll .poll-nums.cmp.solo { grid-template-columns: auto; }
#ov-poll .poll-nums.cmp.solo .pc-tag.pc-a, #ov-poll .poll-nums.cmp.solo .poll-count { grid-column: 1; }

/* ---- rehearsal notes (N) ---- */
#ov-notes {
  z-index: 60; background: linear-gradient(90deg, rgba(3,5,12,.985) 0%, rgba(3,5,12,.975) 62%, rgba(3,5,12,.94) 100%);
  padding: 72px 96px; color: var(--bone);
}
#ov-notes .nt-flag { position: absolute; right: 96px; top: 72px; font: 600 28px/1 var(--font-body); color: var(--show); border: 2px solid var(--show); border-radius: 10px; padding: 10px 14px; }
#ov-notes .nt-head { display: flex; align-items: baseline; gap: 40px; }

/* ---- art/art.css ---- */
/* src/art/art.css — Glowline drawing style (art agent). Contract: notes/BRIEF.md § 3 + the shared engine/art contract.
   A drawing = <svg class="gl"> with <g class="gl-halo"> (wide, faint) under <g class="gl-core"> (bright, single weight).
   Stroke widths are screen px at any size (--gl-k = viewBox units per px, set by ALLIN.art.gl).
   Colour hooks (inherit from any ancestor): --gl-color (strokes), --gl-accent (parts with .acc).
   State hooks (set on any ancestor, transitions included):
     --fan: 0|1      peacock tail shut (folded train) / fanned, feather by feather (.fan, .train)
     --grow: 1..1.6  balloon size (.balloon), strokes stay the same weight
     --level: px     meter level rise in viewBox units (.level line), --fill: 0..1 the tint under it (.fill)
     --buzz: 0|1     phone vibration marks (.buzz)
     --stream: 0|1   hourglass sand stream (.stream); --sand-top / --sand-bot: scale of the two heaps (1 = drawn)
     --ph: 0|1       gl-ad placeholder picture in the image area (.ph); 0 = a blank ad
     --coin: 0|1     the coin of gl-hand-coin / gl-pathway (.coin)
     --board: angle, --board-lift: units   the skater's board (.board) turns about its centre / lifts
   Draw-on: NOT in this file any more (repair round 1, review V12). Every draw-on is a Web Animation made by script
   (ALLIN.art.anim / ALLIN.art.draw in src/art/components.js, driven by the scene kit from the engine's events): the
   beat-0 drawings draw out of the landing point (--land-x / --land-y), nearest strokes first, complete <= 1.6 s after
   landing, built paused while the cut flies and only played at landing; later-beat reveals draw in the authored order
   (--i x --gl-step after --gl-d). The CSS rules that started them (.scene.landed .gl [pathLength] { animation: … })
   made the .arriving -> .landed switch restyle every stroke and start ~150-300 CSS animations in the landing frame.
   Do not add a CSS rule keyed on a scene state (.landed, .arriving, [data-beat]) that targets [pathLength] / .pt /
   .wash: it restyles every stroke of the scene when that state changes. --gl-land-delay (default 0ms, set it on
   #stage or a scene) still delays every beat-0 draw-on (read when the landing is planned). */

.gl {
  --glc: var(--gl-color, var(--signal));
  --gla: var(--gl-accent, var(--glc));
  --glw: calc(var(--gl-k, 1) * var(--gl-weight, 1));
  display: block; overflow: visible;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
  color: var(--glc);
}
.gl-halo { stroke: var(--glc); stroke-width: calc(var(--gl-halo) * var(--glw)); opacity: var(--gl-halo-a); }
.gl-core { stroke: color-mix(in srgb, var(--glc) 72%, #fff); stroke-width: calc(var(--gl-core) * var(--glw)); }
.gl-halo .acc, .gl-halo .acc [pathLength] { stroke: var(--gla); }
.gl-core .acc, .gl-core .acc [pathLength] { stroke: color-mix(in srgb, var(--gla) 72%, #fff); }
.gl-core .thin { stroke-width: calc(var(--gl-core) * var(--glw) * .62); }
.gl-halo .thin { stroke-width: calc(var(--gl-halo) * var(--glw) * .7); }
.gl .dim { opacity: .5; }

/* tint wash inside closed shapes (core copy only) */
.gl .wash { fill: var(--glc); fill-opacity: .055; stroke: none; }
.gl .acc .wash, .gl .wash.acc { fill: var(--gla); fill-opacity: .07; }
.gl .wash.on, .gl .wash.strong { fill: color-mix(in srgb, var(--glc) 70%, #fff); fill-opacity: .3; }
.gl .acc .wash.strong, .gl .wash.acc.strong { fill: color-mix(in srgb, var(--gla) 70%, #fff); }

/* puncta: bright dots, with a soft halo disc */
.gl-core .pt { fill: color-mix(in srgb, var(--glc) 45%, #fff); stroke: none; }
.gl-core .acc .pt, .gl-core .pt.acc { fill: color-mix(in srgb, var(--gla) 45%, #fff); }
.gl-halo .pt { fill: var(--glc); stroke: var(--glc); stroke-width: calc(var(--gl-halo) * var(--glw) * .9); }
.gl-halo .acc .pt, .gl-halo .pt.acc { fill: var(--gla); stroke: var(--gla); }

/* ---------- draw-on: Web Animations made by script (see the header); rest state = solid (no dash), so instant renders,
   screenshots and settle() are always complete. Under .instant the part transitions below snap. ---------- */
.scene.instant .gl, .scene.instant .gl * { animation: none !important; transition: none !important; }

/* ---------- part states ---------- */
/* peacock: feathers rotate about the tail base, one after another (--k) */
.gl .fan {
  transform: rotate(calc(var(--open, 0deg) * var(--fan, 1) + var(--shut, -96deg) * (1 - var(--fan, 1))));
  opacity: var(--fan, 1);
  transition: transform calc(1000ms * var(--motion)) var(--ease) calc(var(--k, 0) * 120ms * var(--motion)),
              opacity calc(260ms * var(--motion)) linear calc(var(--k, 0) * 120ms * var(--motion));
}
.gl .train { opacity: calc(1 - var(--fan, 1)); transition: opacity calc(500ms * var(--motion)) var(--ease); }
/* balloon grows from its knot; strokes keep their weight */
.gl .balloon { transform: scale(var(--grow, 1)); transition: transform calc(700ms * var(--motion)) var(--ease-pop); }
.gl-core .balloon [pathLength] { stroke-width: calc(var(--gl-core) * var(--glw) / var(--grow, 1)); }
.gl-halo .balloon [pathLength] { stroke-width: calc(var(--gl-halo) * var(--glw) / var(--grow, 1)); }
.gl-core .balloon .thin { stroke-width: calc(var(--gl-core) * var(--glw) * .62 / var(--grow, 1)); }
/* meter */
.gl .level { transform: translate(0px, calc(var(--level, 0) * -1px)); transition: transform calc(1200ms * var(--motion)) var(--ease); }
.gl .fill { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(var(--fill, 1)); transition: transform calc(1200ms * var(--motion)) var(--ease); }
.gl .buzz { opacity: var(--buzz, 1); transition: opacity calc(200ms * var(--motion)) linear; }
.gl .stream { opacity: var(--stream, 1); transition: opacity calc(300ms * var(--motion)) linear; }
.gl .ph { opacity: var(--ph, 1); transition: opacity calc(300ms * var(--motion)) linear; }
.gl .coin { opacity: var(--coin, 1); transition: opacity calc(300ms * var(--motion)) linear; }
/* skater board (gl-skater-air / -land / -fall, group .board): --board turns it about its own centre (an angle),
   --board-lift raises it (viewBox units); e.g. the fall flips it: --board: 160deg; --board-lift: 40 */
.gl .board { transform-box: fill-box; transform-origin: 50% 50%;
  transform: translate(0px, calc(var(--board-lift, 0) * -1px)) rotate(var(--board, 0deg));
  transition: transform calc(800ms * var(--motion)) var(--ease); }
/* hourglass sand: the top heap shrinks into the neck, the pile grows (strokes keep their weight) */
.gl .sand-top, .gl .sand-bot { transform-box: fill-box; transform-origin: 50% 100%; transition: transform calc(1400ms * var(--motion)) var(--ease); }
.gl .sand-top { transform: scale(var(--sand-top, 1)); }
.gl .sand-bot { transform: scale(var(--sand-bot, 1)); }
.gl-core .sand-top [pathLength] { stroke-width: calc(var(--gl-core) * var(--glw) / var(--sand-top, 1)); }
.gl-core .sand-bot [pathLength] { stroke-width: calc(var(--gl-core) * var(--glw) / var(--sand-bot, 1)); }
.gl-halo .sand-top [pathLength] { stroke-width: calc(var(--gl-halo) * var(--glw) / var(--sand-top, 1)); }
.gl-halo .sand-bot [pathLength] { stroke-width: calc(var(--gl-halo) * var(--glw) / var(--sand-bot, 1)); }

/* ---- scenes/_kit.css ---- */
/* src/scenes/_kit.css — Glowline scene kit styles (art kit). Pairs with src/scenes/_kit.js; the guide is notes/KIT.md.
   Sizes from tokens (minimums: title 76 >= 68, line 52 >= 46, labels 44 >= 40, cite 32 >= 30). Text colours are only
   bone / mist / signal / gas / show / brake (>= 7:1 on --void); labels over art carry a dark text halo as a scrim. */

/* ---------------- positioned pieces ---------------- */
.k-head, .k-lines, .k-title, .k-free, .k-label, .k-cite, .k-pic, .k-spot, .k-dots, .k-options, .k-chips,
.k-stat, .k-col, .k-ring, .k-bar { position: absolute; }
.k-head { display: flex; flex-direction: column; align-items: flex-start; }
.k-head .k-title, .k-lines.flow { position: relative; }
.k-head .k-lines.flow { margin-top: 46px; }

/* ---------------- title: condenses out of the light when the scene lands ---------------- */
.k-title {
  margin: 0; max-width: 1500px;
  font: 700 var(--fs-title)/1.08 var(--font-display); letter-spacing: -.005em;
  color: var(--bone); text-wrap: balance;
  text-shadow: 0 0 34px rgba(143, 243, 255, .16);
}
.k-title.k-hero { font-size: var(--fs-hero); line-height: .98; letter-spacing: -.01em; }
@keyframes k-condense {
  0%   { opacity: 0; translate: 0 14px; text-shadow: 0 0 44px rgba(143, 243, 255, .85); }
  55%  { opacity: 1; text-shadow: 0 0 30px rgba(143, 243, 255, .5); }
  100% { opacity: 1; translate: 0 0; text-shadow: 0 0 34px rgba(143, 243, 255, .16); }
}
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes k-pop { 0% { opacity: 0; scale: .7; } 60% { opacity: 1; } 100% { opacity: 1; scale: 1; } }
.scene.landed .k-title:not([data-rv]) { animation: k-condense calc(600ms * var(--motion)) var(--ease) calc(80ms * var(--motion)) backwards; }
.scene.landed .k-cite:not([data-rv]) { animation: k-fade calc(700ms * var(--motion)) ease-out calc(450ms * var(--motion)) backwards; }
.scene.landed .k-chips:not([data-rv]) { animation: k-fade calc(600ms * var(--motion)) ease-out calc(250ms * var(--motion)) backwards; }

/* the "condense" reveal (data-fx="condense"): a 14 px rise out of a brief glow */
.scene [data-rv="pre"][data-fx="condense"] { opacity: 0; translate: 0 14px; }
.scene [data-rv="post"][data-fx="condense"] { opacity: 0; translate: 0 -10px; }
@keyframes k-flash {
  0%   { text-shadow: 0 0 40px rgba(143, 243, 255, .9); }
  100% { text-shadow: 0 0 26px rgba(143, 243, 255, .3); }
}

/* ---------------- beat lines: a dendrite of nodes; the newest is bright, earlier ones settle ---------------- */
.k-lines { display: flex; flex-direction: column; gap: var(--k-gap, 30px); }
.k-ln { position: relative; padding-left: 50px; --k-ny: 31px; }
/* line rule: <= 2 rows per line (choose the stack width lw so it holds); balance, not pretty: pretty leaves two-word
   orphans ("…that's / the point") */
.k-ln .k-lt {
  margin: 0;
  font: 600 var(--fs-line)/1.18 var(--font-body);
  color: var(--bone); text-wrap: balance;
  text-shadow: 0 0 26px rgba(143, 243, 255, .3);
  transition: color calc(500ms * var(--motion)) var(--ease), text-shadow calc(500ms * var(--motion)) var(--ease);
}
.k-ln.t-show .k-lt { color: var(--show); } .k-ln.t-gas .k-lt { color: var(--gas); }
.k-ln.t-signal .k-lt { color: var(--signal); } .k-ln.t-brake .k-lt { color: var(--brake); }
.scene.landed [data-rv="on"][data-fx="condense"] > .k-lt {
  animation: k-flash calc(800ms * var(--motion)) ease-out calc(var(--kd, 0ms) * var(--motion)) backwards;
}
.k-node {
  position: absolute; left: 5px; top: calc(var(--k-ny) - 10px); width: 20px; height: 20px; border-radius: 50%;
  background: color-mix(in srgb, var(--k-accent, var(--signal)) 70%, #fff);
  box-shadow: 0 0 0 7px color-mix(in srgb, var(--k-accent, var(--signal)) 20%, transparent),
              0 0 26px 6px color-mix(in srgb, var(--k-accent, var(--signal)) 42%, transparent);
  transition: background calc(500ms * var(--motion)) var(--ease), box-shadow calc(500ms * var(--motion)) var(--ease);
}
.k-axon {
  position: absolute; left: 14px; width: 2px; top: calc(var(--k-ny) - var(--k-reach, 0px)); height: var(--k-reach, 0px);
  background: linear-gradient(to bottom, rgba(74, 90, 146, .55), color-mix(in srgb, var(--k-accent, var(--signal)) 55%, transparent));
  border-radius: 1px;
}
.k-ln.k-first .k-axon { display: none; }
/* glossary card */
.k-ln.k-card { --k-ny: 51px; }
.k-ln.k-card .k-lt {
  padding: 18px 30px 21px; border-radius: 20px;
  border: 2px solid color-mix(in srgb, var(--signal) 48%, transparent);
  background: linear-gradient(180deg, rgba(10, 17, 48, .86), rgba(10, 17, 48, .66));
  box-shadow: 0 0 30px rgba(143, 243, 255, .12), inset 0 0 22px rgba(143, 243, 255, .06);
  transition: color calc(500ms * var(--motion)) var(--ease), border-color calc(500ms * var(--motion)) var(--ease);
}
.k-term { color: var(--signal); }
/* settled: the next line has arrived (class k-settle-N + beat class bN on the scene) */
:is(.scene.b1 .k-settle-1, .scene.b2 .k-settle-2, .scene.b3 .k-settle-3, .scene.b4 .k-settle-4, .scene.b5 .k-settle-5,
    .scene.b6 .k-settle-6, .scene.b7 .k-settle-7, .scene.b8 .k-settle-8, .scene.b9 .k-settle-9, .scene.b10 .k-settle-10,
    .scene.b11 .k-settle-11, .scene.b12 .k-settle-12) > .k-lt { color: var(--mist); text-shadow: none; }
:is(.scene.b1 .k-settle-1, .scene.b2 .k-settle-2, .scene.b3 .k-settle-3, .scene.b4 .k-settle-4, .scene.b5 .k-settle-5,
    .scene.b6 .k-settle-6, .scene.b7 .k-settle-7, .scene.b8 .k-settle-8, .scene.b9 .k-settle-9, .scene.b10 .k-settle-10,
    .scene.b11 .k-settle-11, .scene.b12 .k-settle-12) > .k-node { background: var(--dim); box-shadow: 0 0 0 6px rgba(34, 51, 110, .35); }
:is(.scene.b1 .k-settle-1, .scene.b2 .k-settle-2, .scene.b3 .k-settle-3, .scene.b4 .k-settle-4, .scene.b5 .k-settle-5,
    .scene.b6 .k-settle-6, .scene.b7 .k-settle-7, .scene.b8 .k-settle-8, .scene.b9 .k-settle-9, .scene.b10 .k-settle-10,
    .scene.b11 .k-settle-11, .scene.b12 .k-settle-12).k-card > .k-lt { border-color: rgba(74, 90, 146, .5); box-shadow: none; background: rgba(10, 17, 48, .55); }
:is(.scene.b1 .k-settle-1, .scene.b2 .k-settle-2, .scene.b3 .k-settle-3, .scene.b4 .k-settle-4, .scene.b5 .k-settle-5,
    .scene.b6 .k-settle-6, .scene.b7 .k-settle-7, .scene.b8 .k-settle-8, .scene.b9 .k-settle-9, .scene.b10 .k-settle-10,
    .scene.b11 .k-settle-11, .scene.b12 .k-settle-12) .k-term { color: color-mix(in srgb, var(--signal) 55%, var(--mist)); }

/* free line / question */
.k-free { margin: 0; font: 600 var(--fs-line)/1.18 var(--font-body); color: var(--bone); text-wrap: balance; text-shadow: 0 0 26px rgba(143, 243, 255, .26); }
.k-free.k-q { font: 700 var(--fs-question)/1.06 var(--font-display); }
.k-free.al-c { text-align: center; } .k-free.al-r { text-align: right; }
.k-free.t-show { color: var(--show); } .k-free.t-gas { color: var(--gas); } .k-free.t-signal { color: var(--signal); } .k-free.t-brake { color: var(--brake); }

/* picture labels: a dark halo keeps them >= 7:1 over the art */
.k-label {
  font: 600 var(--fs-body)/1.1 var(--font-body); white-space: nowrap;
  color: var(--bone);
  text-shadow: 0 0 3px var(--void), 0 0 10px var(--void), 0 0 22px rgba(5, 7, 15, .9);
}
.k-label.t-show { color: var(--show); } .k-label.t-gas { color: var(--gas); } .k-label.t-signal { color: var(--signal); }
.k-label.t-brake { color: var(--brake); } .k-label.t-mist { color: var(--mist); }

/* citation */
.k-cite { margin: 0; font: 500 var(--fs-cite)/1.25 var(--font-body); color: var(--mist); letter-spacing: .005em; }
.k-cite.small { font-size: 30px; }

/* ---------------- pictures ---------------- */
.k-pic > .gl { width: 100%; height: 100%; }
.k-spot {
  --c: var(--gas); --k-fire: var(--c);
  width: calc(var(--r) * 2); height: calc(var(--r) * 2); margin: calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 45%, #fff) 0 20%, color-mix(in srgb, var(--c) 60%, transparent) 38%,
    color-mix(in srgb, var(--c) 18%, transparent) 70%, transparent);
}
.k-spot > b { position: absolute; inset: -12px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--c) 75%, transparent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
.k-dots { --c: var(--signal); }
.k-dot {
  position: absolute; width: calc(var(--r) * 2); height: calc(var(--r) * 2); margin: calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
  border-radius: 50%; background: color-mix(in srgb, var(--c) 28%, transparent);
  transition: background calc(500ms * var(--motion)) var(--ease), box-shadow calc(500ms * var(--motion)) var(--ease), opacity calc(500ms * var(--motion)) var(--ease);
}
.k-dot.lit { background: color-mix(in srgb, var(--c) 72%, #fff); box-shadow: 0 0 12px 2px color-mix(in srgb, var(--c) 50%, transparent); }

/* ---------------- option nodes (hand votes) ---------------- */
.k-options { display: flex; gap: 64px; align-items: flex-start; }
.k-options.col { flex-direction: column; gap: 26px; }
.k-opt { --c: var(--signal); --k-fire: var(--c); display: flex; flex-direction: column; align-items: center; gap: 18px; }
.k-options.col .k-opt { flex-direction: row; gap: 26px; }
.k-opt-node {
  width: 78px; height: 78px; border-radius: 50%;
  border: 5px solid color-mix(in srgb, var(--c) 72%, #fff);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 34%, transparent), transparent);
  box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 13%, transparent), 0 0 30px color-mix(in srgb, var(--c) 42%, transparent);
}
.k-opt-t { font: 600 var(--fs-body)/1.1 var(--font-body); color: var(--bone); white-space: nowrap; }
.scene.landed [data-rv="on"] > .k-opt, .scene.landed .k-options:not([data-rv]) > .k-opt {
  animation: k-pop calc(520ms * var(--motion)) var(--ease-pop) calc((var(--kd, 0ms) + var(--k, 0) * 110ms) * var(--motion)) backwards;
}

/* ---------------- score chips (A amber, B green) ---------------- */
.k-chips { display: flex; gap: 18px; }
.k-chip {
  --c: var(--signal); --k-fire: var(--c);
  display: flex; align-items: center; gap: 14px; height: 78px; padding: 0 28px 0 24px; border-radius: 39px;
  border: 3px solid color-mix(in srgb, var(--c) 78%, #fff);
  background: linear-gradient(180deg, rgba(10, 17, 48, .9), rgba(10, 17, 48, .7));
  box-shadow: 0 0 26px color-mix(in srgb, var(--c) 28%, transparent), inset 0 0 18px color-mix(in srgb, var(--c) 12%, transparent);
}
.k-chip-a { --c: var(--show); } .k-chip-b { --c: var(--gas); }
/* the chip that scores is hot on its scoring beat (data-hot = the `at` beat) and while it fires: a brighter ring and
   glow OUTSIDE the chip (the inside stays dark, so the letter and number keep their contrast) */
.k-chip {
  border-color: color-mix(in srgb, var(--c) calc(78% - 8% * var(--k-hot, 0)), #fff);
  box-shadow: 0 0 0 calc(5px * var(--k-hot, 0)) color-mix(in srgb, var(--c) calc(34% * var(--k-hot, 0)), transparent),
              0 0 calc(26px + 30px * var(--k-hot, 0)) color-mix(in srgb, var(--c) calc(28% + 42% * var(--k-hot, 0)), transparent),
              inset 0 0 18px color-mix(in srgb, var(--c) 12%, transparent);
  transition: border-color calc(420ms * var(--motion)) var(--ease), box-shadow calc(420ms * var(--motion)) var(--ease);
}
.k-chip-l { font: 700 46px/1 var(--font-display); color: color-mix(in srgb, var(--c) calc(100% - 14% * var(--k-hot, 0)), #fff);
  text-shadow: 0 0 calc(18px * var(--k-hot, 0)) color-mix(in srgb, var(--c) 60%, transparent); }
.k-chip-n { display: grid; overflow: hidden; height: 58px; align-items: center; min-width: 30px; text-align: center;
  font: 700 50px/58px var(--font-display); color: var(--bone); font-variant-numeric: tabular-nums; }
.k-chip-n > b { grid-area: 1 / 1; font-weight: 700; }
.scene .k-chip-n > [data-rv="pre"][data-fx="roll"] { opacity: 0; translate: 0 64px; }
.scene .k-chip-n > [data-rv="post"][data-fx="roll"] { opacity: 0; translate: 0 -64px; transition-duration: calc(420ms * var(--motion)); transition-delay: calc(380ms * var(--motion)); }

/* ---------------- stat card, column card ---------------- */
.k-stat { --c: var(--bone); display: flex; flex-direction: column; gap: 10px; }
.k-stat.al-c { align-items: center; text-align: center; }
.k-stat-n { font: 700 var(--fs-stat)/1 var(--font-display); color: var(--c); letter-spacing: -.01em;
  text-shadow: 0 0 44px color-mix(in srgb, var(--c) 32%, transparent); white-space: nowrap; }
.k-stat-l { font: 600 var(--fs-body)/1.2 var(--font-body); color: var(--mist); }
.k-col {
  --c: var(--signal);
  padding: 30px 34px 32px; border-radius: 24px;
  border: 2px solid color-mix(in srgb, var(--c) 55%, transparent);
  background: linear-gradient(180deg, rgba(10, 17, 48, .9), rgba(10, 17, 48, .72));
  box-shadow: 0 0 34px color-mix(in srgb, var(--c) 14%, transparent);
  transition: border-color calc(600ms * var(--motion)) var(--ease);
}
.k-col.dim { border-color: rgba(74, 90, 146, .5); box-shadow: none; }
.k-col-h { margin: 0; font: 700 54px/1.08 var(--font-display); color: var(--c); }
.k-col-s { margin: 16px 0 0; font: 500 40px/1.25 var(--font-body); color: var(--bone); }
.k-col-score { margin: 16px 0 0; font: 700 50px/1.1 var(--font-display); color: var(--bone); }
.k-col-v { margin: 20px 0 0; padding-top: 18px; border-top: 2px solid rgba(168, 182, 230, .22);
  font: 600 var(--fs-body)/1.2 var(--font-body); color: var(--c); }

/* ---------------- timers ---------------- */
.k-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.k-ring circle { fill: none; stroke-linecap: round; }
.k-ring-track { stroke: rgba(34, 51, 110, .85); stroke-width: 7; }
.k-ring-halo { stroke: var(--signal); stroke-width: 22; opacity: .16; }
.k-ring-core { stroke: color-mix(in srgb, var(--signal) 72%, #fff); stroke-width: 7; }
.k-ring-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 700 84px/1 var(--font-display); color: var(--bone); font-variant-numeric: tabular-nums; }
.k-ring.low .k-ring-halo, .k-ring.low .k-ring-core { stroke: var(--show); }
.k-ring.low .k-ring-n { color: var(--show); }
.k-ring.done .k-ring-halo, .k-ring.done .k-ring-core { opacity: 0; }
.k-bar { height: 30px; }
.k-bar-track { position: absolute; left: 0; right: 0; top: 11px; height: 8px; border-radius: 4px; background: rgba(34, 51, 110, .75); }
.k-bar-fill { position: absolute; left: 0; right: 0; top: 7px; height: 16px; border-radius: 8px; transform-origin: 0 50%;
  background: linear-gradient(90deg, color-mix(in srgb, var(--signal) 65%, #fff), var(--signal));
  box-shadow: 0 0 18px rgba(143, 243, 255, .5); }

/* ---------------- firing: bloom + ring ripple (K.fire adds .k-fire into the scene) ---------------- */
.k-fire { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 30; }
.k-fire > i { position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / -2); width: var(--s); height: var(--s); border-radius: 50%; opacity: 0; }
.k-fire-bloom { mix-blend-mode: screen;
  background: radial-gradient(closest-side, color-mix(in srgb, color-mix(in srgb, var(--c) 80%, #fff) 70%, transparent), color-mix(in srgb, var(--c) 24%, transparent) 55%, transparent); }
.k-fire-ring { border: 4px solid color-mix(in srgb, var(--c) 78%, #fff); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 55%, transparent); }
.k-fire-ring.r2 { border-width: 2px; }

/* ---------------- the cue rule (BRIEF § 3 colour meaning; review V6) ----------------
   --cue magenta (the attractive cue: photo frames, ads) is the loudest colour in the palette, so it never holds the
   eye by default: cue art RESTS at opacity .55 and reaches 1 only while it is the beat's subject or firing.
   Hot = class k-hot (always), data-hot="1 3" (on beats 1 and 3: K option hot: [1, 3]), or .k-firing (K.fire adds it
   while the bloom plays). Any element can carry data-hot / k-hot; everything inside it inherits --k-hot: 1.
   K.pic(…, { color: 'cue' }) -> .k-cue (the whole drawing rests); { accent: 'cue' } -> .k-cue-acc (its accent parts).
   --k-hot-delay (default 0ms): a delay for the rise to hot (e.g. S10's photos light one by one). */
.k-pic > .gl {
  opacity: var(--k-dim, 1);
  transition: opacity calc(380ms * var(--motion)) var(--ease) var(--k-hot-delay, 0ms);
}
.k-cue > .gl { opacity: calc((.55 + .45 * var(--k-hot, 0)) * var(--k-dim, 1)); }
.k-cue-acc > .gl .acc:not(.acc .acc) {
  opacity: calc(.55 + .45 * var(--k-hot, 0));
  transition: opacity calc(380ms * var(--motion)) var(--ease) var(--k-hot-delay, 0ms);
}
.k-hot, .k-firing,
.scene[data-beat="0"] [data-hot~="0"], .scene[data-beat="1"] [data-hot~="1"], .scene[data-beat="2"] [data-hot~="2"],
.scene[data-beat="3"] [data-hot~="3"], .scene[data-beat="4"] [data-hot~="4"], .scene[data-beat="5"] [data-hot~="5"],
.scene[data-beat="6"] [data-hot~="6"], .scene[data-beat="7"] [data-hot~="7"], .scene[data-beat="8"] [data-hot~="8"],
.scene[data-beat="9"] [data-hot~="9"], .scene[data-beat="10"] [data-hot~="10"], .scene[data-beat="11"] [data-hot~="11"],
.scene[data-beat="12"] [data-hot~="12"] { --k-hot: 1; --k-dim: 1; }
/* the scoring beat: when a chip scores (it is hot: data-hot = its `at`), the pictures step back to .7 so the chip
   carries the beat (like earlier lines settling). Hot pictures stay full. */
.scene[data-beat="1"]:has(.k-chip[data-hot~="1"]), .scene[data-beat="2"]:has(.k-chip[data-hot~="2"]),
.scene[data-beat="3"]:has(.k-chip[data-hot~="3"]), .scene[data-beat="4"]:has(.k-chip[data-hot~="4"]),
.scene[data-beat="5"]:has(.k-chip[data-hot~="5"]), .scene[data-beat="6"]:has(.k-chip[data-hot~="6"]),
.scene[data-beat="7"]:has(.k-chip[data-hot~="7"]), .scene[data-beat="8"]:has(.k-chip[data-hot~="8"]),
.scene[data-beat="9"]:has(.k-chip[data-hot~="9"]), .scene[data-beat="10"]:has(.k-chip[data-hot~="10"]),
.scene[data-beat="11"]:has(.k-chip[data-hot~="11"]), .scene[data-beat="12"]:has(.k-chip[data-hot~="12"]) { --k-dim: .7; }

/* ---------------- instant: everything at its end state ----------------
   One rule keyed on .instant alone (repair round 1, review V12). The old form, .scene.instant [class*="k-"] > *, put an
   attribute selector on `class` in front of a universal subject, so Blink invalidated the WHOLE subtree of ANY element
   whose class attribute changed: #stage.travelling going off, .arriving -> .landed, every beat class (b1, b2 …), every
   firing: the landing frame restyled all ~320 elements of the scene and the stage. Never write [class*=…] / [class^=…]
   / [class~=…] (or any attribute selector on an attribute that changes often) left of a combinator. */
.scene.instant * { animation: none !important; transition: none !important; }

/* first-use warm-up (review CARD): ALLIN.kit.warmUp() puts one instance of every blurred / blended kit style here, once,
   ~1 s on idle after boot, so the GPU compiles its shaders before the first glossary card. Invisible (opacity .002 =
   at most +0.5/255), never clickable, removed by the kit. Not a .scene: no engine code or tool counts it. */
.k-warm { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: .002; pointer-events: none; z-index: 40; }
.k-warm .k-fire > i { opacity: 1; }

/* soft scrims behind small text that sits on the living field (keeps the measured contrast well above 7:1) */
.k-cite, .k-label { isolation: isolate; }
.k-cite::before, .k-label::before {
  content: ''; position: absolute; inset: -18px -48px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(5, 7, 15, .78), rgba(5, 7, 15, .5) 55%, rgba(5, 7, 15, 0));
}
/* ---- scenes/s01.css ---- */
.scene[data-id="S1"] .s1-hero { text-align: center; max-width: none; }

  background: radial-gradient(closest-side, rgba(4, 10, 16, .72), rgba(4, 10, 16, 0)); pointer-events: none; }
.scene[data-id="S1"] .s1-course { font-size: 40px; color: var(--mist); }
.scene[data-id="S1"] .s1-sub { font-size: 60px; font-weight: 600; color: var(--signal); }

/* S5 (template): the peacock's tail stays folded (a train) at b0 and fans out feather by feather from b1.
   The engine's beat classes are cumulative (b0 b1 b2 … up to the current beat), so :not(.b1) = beat 0 only.
   --fan drives the drawing's parts (src/art/art.css: .fan feathers rotate in one by one by their --k; .train fades). */
.scene[data-id="S5"]:not(.b1) .s5-bird { --fan: 0; }

  background: rgba(5, 9, 16, .92); box-shadow: 0 0 34px rgba(143, 243, 255, .5); font: 700 44px/1.1 var(--font-body); color: var(--bone); white-space: nowrap; }
.scene[data-id="S8"].b3 .s8-n:not(.keep) { opacity: .14; }

/* ---- scenes/s16.css ---- */

.scene[data-id="S16"] .s16-hid { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(120, 140, 190, .8);
  transition: translate calc(1000ms * var(--motion)) var(--ease) calc(800ms * var(--motion)); }
.scene[data-id="S16"] .s16-hid.h1 { left: 1560px; top: 500px; } .scene[data-id="S16"] .s16-hid.h2 { left: 1560px; top: 540px; } .scene[data-id="S16"] .s16-hid.h3 { left: 1560px; top: 580px; }

.scene[data-id="S16"] .s16-flat { position: absolute; left: 960px; top: 925px; width: 820px; height: 0; border-top: 3px solid rgba(143, 243, 255, .7); }
.scene[data-id="S16"] .k-stat-l { background: rgba(5, 7, 15, .7); padding: 0 10px; border-radius: 8px; }
/* ---- scenes/s17.css ---- */
.scene[data-id="S17"] .s17-flat { position: absolute; left: 960px; top: 850px; width: 860px; height: 0; border-top: 4px solid rgba(143, 243, 255, .8); }
/* ---- scenes/s18.css ---- */
.scene[data-id="S18"] .k-col { padding: 12px 24px; } .scene[data-id="S18"] .k-col-h { font-size: 46px; }

.scene[data-id="S18"] .s18-fork path[style*="--i:2;"], .scene[data-id="S18"] .s18-fork path[style*="--i:4;"] { transition: opacity calc(700ms * var(--motion)) var(--ease); }
.scene[data-id="S18"].b2 .s18-fork path[style*="--i:2;"], .scene[data-id="S18"].b2 .s18-fork path[style*="--i:4;"] { opacity: .35; }
